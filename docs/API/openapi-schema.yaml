openapi: 3.0.3
info:
  title: ApexStore Mini E-Commerce & Order Management API
  version: 1.0.0
  description: Comprehensive REST API documentation for ApexStore e-commerce platform.
    Covers Authentication, Products, Categories, Cart, Wishlist, Coupons, Orders,
    Payments, Inventory, and Admin Analytics.
